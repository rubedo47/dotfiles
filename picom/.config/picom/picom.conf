#################################
# Backend
#################################

backend = "glx";
vsync = true;

#################################
# General
#################################

use-damage = true;
log-level = "warn";

#################################
# Shadows
#################################

shadow = false;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.75;

shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'dmenu'",
  "class_g = 'Conky'",
  "class_g = 'Notification'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
# Corners
#################################

corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'"
];

#################################
# Opacity
#################################

#inactive-opacity = 0.95;
#active-opacity = 1.0;
frame-opacity = 1.0;

# FIXED: Corrected spelling from 'fasle' to 'false'
inactive-opacity-override = false;

# FIXED: Isolated otter specifically so it doesn't get sucked into St rules
opacity-rule = [
    "100:class_i = 'otter'",
    "90:class_g = 'St' && class_i != 'otter' && focused",
    "60:class_g = 'St' && class_i != 'otter' && !focused"
];

#################################
# Fading
#################################

fading = true;

fade-in-step = 0.03;
fade-out-step = 0.05;

fade-delta = 5;

no-fading-openclose = false;
fade-exclude = [
  "class_i = 'otter'"
];

#################################
# Blur 
#################################

blur:
{
    method = "none"; # Disabled cleanly since strength was 0
};

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
];

#################################
# Animations 
#################################

animations = true;

animation-window-mass = 0.5;
animation-stiffness = 220;
animation-dampening = 24;
animation-clamping = false;

#################################
# Window Types
#################################

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 1.0; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};

#################################
# Misc
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;

unredir-if-possible = false;

#################################
# Exclusions
#################################

focus-exclude = [
    "class_g = 'Cairo-clock'"
];
